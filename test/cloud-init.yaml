#cloud-config
hostname: tessel-test
ssh_pwauth: true

users:
  - name: dev
    groups: wheel
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    plain_text_passwd: tessel
    ssh_authorized_keys:
      - SSH_PUBKEY_PLACEHOLDER

write_files:
  # autologin on tty1 so the qemu window lands straight on a shell
  - path: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin dev --noclear %I $TERM
  - path: /root/tessel.pub
    content: |
      SSH_PUBKEY_PLACEHOLDER

runcmd:
  - [ sh, -c, "mkdir -p /home/dev/.ssh && cat /root/tessel.pub > /home/dev/.ssh/authorized_keys" ]
  - [ sh, -c, "chown -R dev:dev /home/dev/.ssh; chmod 700 /home/dev/.ssh; chmod 600 /home/dev/.ssh/authorized_keys" ]
  # f40 is eol, its mirrors are gone. point dnf at the archive.
  - [ sh, -c, "sed -i -e 's|^metalink=|#metalink=|' -e 's|^#baseurl=http://download.example/pub/fedora/linux|baseurl=https://dl.fedoraproject.org/pub/archive/fedora/linux|' /etc/yum.repos.d/fedora*.repo" ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, restart, getty@tty1 ]
